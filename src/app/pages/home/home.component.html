<h1>What's new?</h1>

<app-search
  [searchName]="'Find movies'"
  (queryEvent)="handleSearch($event)"
></app-search>
<app-sort
  [title]="'Sort Movies'"
  [options]="sortingMovies"
  (selectionChange)="handleSortSelection($event)"
>
</app-sort>
<div class="movies__movie-list">
  @for (movie of selectedFoundMovies$ | async; track movie) {
  <app-movie-card [movie]="movie"> </app-movie-card>
  }
</div>
